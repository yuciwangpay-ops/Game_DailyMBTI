<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaPact 遊戲大廳</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 基礎樣式 */
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .hidden {
      display: none !important;
    }

    .form-control {
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      margin-bottom: 10px;
    }

    /* 按鈕樣式 */
    .btn-main {
      background: linear-gradient(45deg, #8e2de2, #4a00e0);
      color: white;
      border: none;
      width: 100%;
    }

    .btn-game {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white;
      border: none;
      width: 100%;
    }

    .status-badge {
      font-size: 0.8em;
      padding: 3px 8px;
      border-radius: 4px;
      background: #333;
    }

    /* 🆕 戰鬥面板專屬樣式 */
    .battle-panel {
      background: #2a2a2a;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      border: 2px solid #444;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .monster-img {
      font-size: 60px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .hp-bar-bg {
      background: #444;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
      border: 1px solid #555;
    }

    .hp-bar-fill {
      background: linear-gradient(90deg, #ff4757, #ff6b81);
      height: 100%;
      width: 100%;
      transition: width 0.5s ease-out;
    }

    .ticket-count {
      font-size: 1.2em;
      color: #ffd700;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px dashed #ffd700;
      padding: 5px;
      border-radius: 8px;
      display: inline-block;
    }

    .btn-attack {
      background: linear-gradient(180deg, #ff6b6b, #ee5253);
      width: 100%;
      font-size: 1.2em;
      padding: 15px;
      border: none;
      border-radius: 50px;
      color: white;
      box-shadow: 0 4px 0 #b33939;
      transition: all 0.1s;
    }

    .btn-attack:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .btn-attack:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 傷害飄字特效 (簡單版) */
    .damage-text {
      color: #ff4757;
      font-weight: bold;
      font-size: 1.5em;
      position: absolute;
      left: 50%;
      animation: fadeUp 1s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -50px);
      }
    }

    @keyframes shake {
      0% {
        transform: translate(1px, 1px) rotate(0deg);
      }

      10% {
        transform: translate(-1px, -2px) rotate(-1deg);
      }

      20% {
        transform: translate(-3px, 0px) rotate(1deg);
      }

      30% {
        transform: translate(3px, 2px) rotate(0deg);
      }

      40% {
        transform: translate(1px, -1px) rotate(1deg);
      }

      50% {
        transform: translate(-1px, 2px) rotate(-1deg);
      }

      60% {
        transform: translate(-3px, 1px) rotate(0deg);
      }

      70% {
        transform: translate(3px, 1px) rotate(-1deg);
      }

      80% {
        transform: translate(-1px, -1px) rotate(1deg);
      }

      90% {
        transform: translate(1px, 2px) rotate(0deg);
      }

      100% {
        transform: translate(1px, -2px) rotate(-1deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="text-center mt-5">
    <div class="spinner-border text-light" role="status"></div>
    <p class="mt-2 text-muted">正在連線至 PersonaPact...</p>
  </div>

  <div id="gameListArea" class="hidden">
    <h4 class="mb-3">📜 我的契約列表</h4>
    <div id="contractsContainer"></div>
  </div>

  <div id="setupFormArea" class="hidden">
    <div class="card p-4">
      <h4 class="mb-3">⚙️ 隊長初始設定</h4>
      <p class="text-muted small">契約: <span id="setupContractName"></span></p>

      <label>隊伍名稱</label>
      <input type="text" id="inputTeamName" class="form-control" placeholder="例如: 屠龍特攻隊">
      <label>怪物名稱</label>
      <input type="text" id="inputEnemy" class="form-control" placeholder="例如: 貪吃惡龍">
      <label>寶物名稱</label>
      <input type="text" id="inputTreasure" class="form-control" placeholder="例如: 傳說中的金蛋">
      <label class="mt-2">故事風格</label>
      <select id="inputTheme" class="form-control">
        <option value="王道熱血奇幻 (預設)">⚔️ 王道熱血奇幻 (勇者 vs 魔王)</option>
        <option value="賽博龐克科幻">🤖 賽博龐克 (駭客 vs 企業巨獸)</option>
        <option value="日式校園異能">🏫 日式校園 (學生會 vs 不良少年)</option>
        <option value="克蘇魯神話驚悚">🐙 克蘇魯驚悚 (調查員 vs 古神)</option>
        <option value="無厘頭爆笑喜劇">🤣 爆笑喜劇 (吐槽役 vs 笨蛋反派)</option>
        <option value="末日殭屍生存">🧟 末日生存 (倖存者 vs 變異體)</option>
      </select>
      <button class="btn btn-main mt-3" onclick="submitSetup()">✨ 啟動遊戲</button>
      <button class="btn btn-outline-secondary mt-2 w-100" onclick="cancelSetup()">取消</button>
    </div>
  </div>

  <div id="battleArea" class="hidden">

    <div class="battle-panel position-relative">
      <div class="monster-img">🦖</div>
      <h3 id="monsterName">載入中...</h3>

      <div class="hp-bar-bg">
        <div id="hpBar" class="hp-bar-fill" style="width: 100%;"></div>
      </div>
      <p class="text-muted small">HP: <span id="hpText">??? / ???</span></p>

      <p id="battleLog" class="mb-2" style="min-height: 24px; font-weight: bold; color: #ff5e5e;">
      </p>

      <div id="ticketContainer" class="ticket-count mb-3 hidden">
        🎫 剩餘票卷: <span id="displayTickets">0</span>
      </div>
    </div>

    <div class="card mt-3 p-3" style="border: 1px solid #444; background: #222;">
      <h5 class="text-warning">🔥 冒險日誌</h5>

      <div class="mb-3 p-2"
        style="background: #333; border-radius: 8px; font-size: 0.9em; line-height: 1.6; color: #ddd;">
        <span id="storyText">正在讀取冒險紀錄...</span>
      </div>

      <hr style="border-color: #555;">

      <h6 class="mb-2 text-info">🤔 接下來該怎麼做？</h6>
      <p id="questionText" class="mb-4 small" style="font-size: 1em;">...</p>

      <button id="btnAction" class="btn btn-main w-100 py-2 mb-3" onclick="performAttack()">
        ⚡️ 選擇下一步行動 (需 1 🎫)
      </button>

      <div id="mbtiOptionsArea" class="d-grid gap-2 hidden">
      </div>

      <p id="mbtiStatus" class="text-center text-success mt-2 small hidden">✅ 已完成今日選擇</p>
    </div>

    <button class="btn btn-outline-light mt-4 w-100" onclick="location.reload()">🔙 回到列表</button>
  </div>

  <script>
    // ==========================================
    // ⚠️ 請記得換成新版 GAS 網址！
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyry-Fmf11Ir8curLXPykG40nYZPiuog9oSBBhjKByyA9BK3MKp67AuG8iZa9R5IdNP/exec";
    const LIFF_ID = "2008941439-M9ODe8F0";

    let userProfile = null;
    let currentSetupContractId = null;
    let currentContractId = null; // 戰鬥時用的 ID

    // 初始化
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        userProfile = await liff.getProfile();
        fetchContracts();

      } catch (err) { alert("啟動失敗: " + err); }
    }

    // 取得契約列表
    async function fetchContracts() {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "get_user_contracts", userId: userProfile.userId })
        });
        const result = await response.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('gameListArea').classList.remove('hidden');

        if (result.success) {
          renderList(result.games);
        } else {
          document.getElementById('contractsContainer').innerHTML = `<p class="text-danger">${result.message}</p>`;
        }
      } catch (e) { alert("連線錯誤: " + e); }
    }

    // 渲染列表
    function renderList(games) {
      const container = document.getElementById('contractsContainer');
      container.innerHTML = "";

      if (games.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">您目前沒有 Game_A 的契約。</p>';
        return;
      }

      games.forEach(game => {
        let actionHtml = "";
        // 修正：傳入 contractId 和 contractName
        if (game.status === "RUNNING") {
          actionHtml = `<button class="btn btn-game" onclick="enterGame('${game.contractId}', '${game.contractName}')">🎮 進入遊戲</button>`;
        } else if (game.status === "PENDING") {
          if (game.role === "Admin") {
            actionHtml = `<button class="btn btn-main" onclick="openSetup('${game.contractId}', '${game.contractName}')">⚙️ 初始設定</button>`;
          } else {
            actionHtml = `<button class="btn btn-secondary" disabled>⏳ 等待隊長設定...</button>`;
          }
        }

        const card = `
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="m-0">${game.contractName}</h5>
              <span class="status-badge">${game.status}</span>
            </div>
            <p class="small text-muted mb-3">ID: ${game.contractId}</p>
            ${actionHtml}
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // --- 設定功能區 ---
    function openSetup(contractId, name) {
      currentSetupContractId = contractId;
      document.getElementById('setupContractName').innerText = name;
      document.getElementById('gameListArea').classList.add('hidden');
      document.getElementById('setupFormArea').classList.remove('hidden');
    }

    function cancelSetup() {
      document.getElementById('gameListArea').classList.remove('hidden');
      document.getElementById('setupFormArea').classList.add('hidden');
    }

    async function submitSetup() {
      const teamName = document.getElementById('inputTeamName').value;
      const enemy = document.getElementById('inputEnemy').value;
      const treasure = document.getElementById('inputTreasure').value;
      // 👇 新增這行：抓取選擇的風格
      const theme = document.getElementById('inputTheme').value; 

      if (!teamName || !enemy || !treasure) { alert("請填寫完整！"); return; }

      const btn = document.querySelector('#setupFormArea .btn-main');
      btn.innerText = "處理中...";
      btn.disabled = true;

      try {
        const payload = {
          action: "create_team",
          userId: userProfile.userId,
          contractId: currentSetupContractId,
          teamName: teamName,
          enemyName: enemy,
          treasureName: treasure,
          storyTheme: theme // 👈 記得把這個傳給後端
        };

        const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        // ... (後面保持不變)
    // ==========================================
    // 🆕 戰鬥功能區 (Game Core)
    // ==========================================
    // 進入戰鬥畫面
    async function enterGame(contractId, contractName) {
      document.getElementById('gameListArea').classList.add('hidden');
      document.getElementById('battleArea').classList.remove('hidden');

      window.currentContractId = contractId;

      // 1. 介面先顯示讀取中，但稍微好看一點
      document.getElementById('monsterName').innerText = "正在分析敵人數據...";
      document.getElementById('monsterName').style.color = "#888"; // 暫時灰色

      // 2. 平行執行：讀取錢包 + 讀取怪物狀態
      // fetchWallet();
      fetchGameState(contractId);
    }


    async function fetchGameState(contractId) {
      try {
        // 🆕 這裡記得要多傳 userId 給後端
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "get_game_state",
            contractId: contractId,
            userId: userProfile.userId // 👈 加上這行
          })
        });
        const result = await response.json();

        if (result.success) {
          // 1. 更新怪物與故事 (基本資料)
          document.getElementById('monsterName').innerText = result.monsterName;
          const pct = Math.max(0, (result.currentHp / result.maxHp) * 100);
          document.getElementById('hpBar').style.width = pct + "%";
          document.getElementById('hpText').innerText = `${result.currentHp} / ${result.maxHp}`;

          document.getElementById('storyText').innerText = result.yesterdaySummary;
          document.getElementById('questionText').innerText = result.mbti.question;

          document.getElementById('displayTickets').innerText = result.userTickets;
          // document.getElementById('displayTickets').innerText += ` (ID: ${contractId.slice(-4)})`;
          // 🆕 數據到了，把整行票卷顯示出來！
          // 👇 暫時加上這一行偵錯，真相馬上大白！
          document.getElementById('displayTickets').innerText += ` [${result.debugInfo}]`;
          document.getElementById('ticketContainer').classList.remove('hidden');
          window.currentQuestionType = result.mbti.type;

          // UI 元素
          const actionBtn = document.getElementById('btnAction');
          const optionsDiv = document.getElementById('mbtiOptionsArea');
          const statusText = document.getElementById('mbtiStatus');

          // ==========================================
          // 🚦 判斷狀態：今天玩過了嗎？
          // ==========================================
          if (result.hasPlayed) {
            // A. 如果玩過了 -> 顯示「已完成」狀態
            actionBtn.classList.add('hidden');       // 藏起行動按鈕
            optionsDiv.classList.add('hidden');      // 藏起選項

            statusText.innerText = "✅ 您今日已選擇：\n" + result.myChoice;
            statusText.classList.remove('hidden');   // 顯示結果文字

          } else {
            // B. 如果還沒玩 -> 準備顯示行動按鈕
            actionBtn.classList.remove('hidden');
            // 👇 🆕 修改這裡：加入票卷判斷邏輯
            if (result.userTickets > 0) {
              // 有票：可以按
              actionBtn.disabled = false;
              actionBtn.innerText = "⚡️ 選擇下一步行動 (需 1 🎫)";
              // 確保樣式是漂亮的亮色
              actionBtn.classList.remove('btn-secondary');
              actionBtn.classList.add('btn-main');
            } else {
              // 沒票：鎖住按鈕，變灰色
              actionBtn.disabled = true;
              actionBtn.innerText = "⛔️ 票卷不足 (請先完成習慣)";
              // 樣式改成灰色
              actionBtn.classList.remove('btn-main');
              actionBtn.classList.add('btn-secondary');
            }

            optionsDiv.classList.add('hidden'); // 選項先藏著，等攻擊後才開
            statusText.classList.add('hidden');

            // 預先生成選項按鈕 (給等一下攻擊後用)
            optionsDiv.innerHTML = "";
            result.mbti.options.forEach((optText, index) => {
              const btn = document.createElement('button');
              btn.className = "btn btn-outline-info text-start btn-sm py-2";
              btn.innerText = ["A. ", "B. ", "C. ", "D. "][index] + optText;
              btn.onclick = () => submitChoice(optText, index, btn);
              optionsDiv.appendChild(btn);
            });
          }

        }
      } catch (e) { console.error("狀態讀取失敗", e); }
    }

    // ⚔️ 發動攻擊 (更新：多傳名字給後端)
    async function performAttack() {
      const btn = document.getElementById('btnAction');
      if (btn.disabled) return;

      btn.disabled = true;
      btn.innerText = "⚡️ 行動判定中...";

      if (navigator.vibrate) navigator.vibrate(200);

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "attack",
            userId: userProfile.userId,
            contractId: window.currentContractId,
            userName: userProfile.displayName // 🆕 新增這一行：把名字傳過去！
          })
        });

        const result = await response.json();

        if (result.success) {
          // 更新戰鬥數據
          document.getElementById('hpText').innerText = `${result.remainingHp} / ${result.maxHp}`;
          const pct = Math.max(0, (result.remainingHp / result.maxHp) * 100);
          document.getElementById('hpBar').style.width = pct + "%";

          document.getElementById('battleLog').innerText = `💥 造成 ${result.damage} 點傷害！`;
          document.getElementById('displayTickets').innerText = result.remainingTickets;

          // ==========================================
          // 🚀 關鍵變身：隱藏大按鈕，顯示 4 個選項
          // ==========================================
          btn.classList.add('hidden'); // 藏起行動按鈕
          document.getElementById('mbtiOptionsArea').classList.remove('hidden'); // 秀出選項
          // ==========================================

        } else {
          alert("行動失敗: " + result.message);
          btn.innerText = "⚡️ 選擇下一步行動 (需 1 🎫)";
          btn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        alert("連線錯誤");
        btn.innerText = "⚡️ 選擇下一步行動 (需 1 🎫)";
        btn.disabled = false;
      }
    }

    // ⚔️ 發動攻擊 (更新：多傳名字給後端)

    // 🆕 送出 MBTI 選擇
    async function submitChoice(choiceText, index, btnElement) {
      // 簡單的視覺回饋：鎖定所有按鈕
      const allBtns = document.querySelectorAll('#mbtiOptionsArea button');
      allBtns.forEach(b => b.disabled = true);
      btnElement.className = "btn btn-info text-white text-start btn-sm"; // 變色表示選中

      try {
        const payload = {
          action: "submit_mbti",
          userId: userProfile.userId,
          contractId: window.currentContractId,
          choice: choiceText,
          choiceIndex: index,
          questionType: window.currentQuestionType
        };

        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('mbtiOptionsArea').classList.add('hidden'); // 隱藏按鈕
          const status = document.getElementById('mbtiStatus');
          status.innerText = "✅ 您的選擇已記錄！(" + choiceText + ")";
          status.classList.remove('hidden');
        } else {
          alert("記錄失敗: " + result.message);
          allBtns.forEach(b => b.disabled = false); // 解鎖重試
        }
      } catch (e) {
        alert("連線錯誤");
        allBtns.forEach(b => b.disabled = false);
      }
    }

    main();
  </script>
</body>

</html>
