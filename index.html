<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaPact 遊戲大廳</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 基礎樣式 */
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .hidden {
      display: none !important;
    }

    .form-control {
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      margin-bottom: 10px;
    }

    /* 按鈕樣式 */
    .btn-main {
      background: linear-gradient(45deg, #8e2de2, #4a00e0);
      color: white;
      border: none;
      width: 100%;
    }

    .btn-game {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white;
      border: none;
      width: 100%;
    }

    .status-badge {
      font-size: 0.8em;
      padding: 3px 8px;
      border-radius: 4px;
      background: #333;
    }

    .ticket-count {
      font-size: 1.1em;
      color: #ffd700;
      font-weight: bold;
      border: 1px dashed #ffd700;
      padding: 2px 10px;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>

<body>
  <div id="loading" class="text-center mt-5">
    <div class="spinner-border text-light" role="status"></div>
    <p class="mt-2 text-muted">正在連線至 PersonaPact...</p>
  </div>

  <div id="gameListArea" class="hidden">
    <h4 class="mb-3">📜 我的契約列表</h4>
    <div id="contractsContainer"></div>
  </div>

  <div id="setupFormArea" class="hidden">
    <div class="card p-4">
      <h4 class="mb-3">⚙️ 隊長初始設定</h4>
      <p class="text-muted small">契約: <span id="setupContractName"></span></p>
      <label class="mt-2">故事風格</label>
      <select id="inputTheme" class="form-control">
        <option value="王道熱血奇幻 (預設)">⚔️ 王道熱血奇幻 (勇者 vs 魔王)</option>
        <option value="賽博龐克科幻">🤖 賽博龐克 (駭客 vs 企業巨獸)</option>
        <option value="日式校園異能">🏫 日式校園 (學生會 vs 不良少年)</option>
        <option value="克蘇魯神話驚悚">🐙 克蘇魯驚悚 (調查員 vs 古神)</option>
        <option value="無厘頭爆笑喜劇">🤣 爆笑喜劇 (吐槽役 vs 笨蛋反派)</option>
        <option value="末日殭屍生存">🧟 末日生存 (倖存者 vs 變異體)</option>
      </select>
      <label>隊伍名稱</label>
      <input type="text" id="inputTeamName" class="form-control" placeholder="例如: 屠龍特攻隊">
      <label>我想對抗</label>
      <input type="text" id="inputEnemy" class="form-control" placeholder="例如: 貪吃惡龍">
      <label>我想獲得</label>
      <input type="text" id="inputTreasure" class="form-control" placeholder="例如: 傳說中的金蛋">

      <button class="btn btn-main mt-3" onclick="submitSetup()">✨ 啟動遊戲</button>
      <button class="btn btn-outline-secondary mt-2 w-100" onclick="cancelSetup()">取消</button>
    </div>
  </div>


  <div id="battleArea" class="hidden">

    <div class="card mt-3 p-3" style="border: 1px solid #444; background: #222;">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-warning m-0">🔥 冒險日誌</h5>
        <div id="ticketContainer" class="ticket-count hidden">
          🎫 剩餘票卷: <span id="displayTickets">0</span>
        </div>
      </div>

      <div class="mb-3 p-2"
        style="background: #333; border-radius: 8px; font-size: 0.9em; line-height: 1.6; color: #ddd;">
        <span id="storyText">正在讀取冒險紀錄...</span>
      </div>

      <hr style="border-color: #555;">

      <h6 class="mb-2 text-info">🤔 接下來該怎麼做？</h6>
      <p id="questionText" class="mb-4 small" style="font-size: 1em;">...</p>

      <div id="mbtiOptionsArea" class="d-grid gap-2 hidden">
      </div>

      <p id="mbtiStatus" class="text-center text-success mt-2 small hidden">✅ 已完成今日選擇</p>
    </div>

    <button class="btn btn-outline-light mt-4 w-100" onclick="location.reload()">🔙 回到列表</button>
  </div>

  <script>
    // ==========================================
    // ⚠️ 請記得換成新版 GAS 網址！
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwVFtnp58L98sIVcoqf60ZpU6vqVmblk-eDcD3l7Hi-PjGWPtHVhKwe0pzIbisfB4ge/exec";
    const LIFF_ID = "2008941439-M9ODe8F0";

    let userProfile = null;
    let currentSetupContractId = null;
    let currentContractId = null; 

    // 1. 主程式
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        userProfile = await liff.getProfile();

        const urlParams = new URLSearchParams(window.location.search);
        const targetContractId = urlParams.get('contractId');

        if (targetContractId) {
          console.log("偵測到指定 ID:", targetContractId);
          fetchContracts(targetContractId);
        } else {
          console.log("無指定 ID，正常載入列表");
          fetchContracts(); 
        }

      } catch (err) {
        alert("啟動失敗: " + err);
      }
    }

    // 2. 抓取列表並分流
    async function fetchContracts(autoOpenId = null) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "get_user_contracts", userId: userProfile.userId })
        });
        const result = await response.json();

        if (result.success) {
          renderList(result.games);
        } else {
          document.getElementById('contractsContainer').innerHTML = `<p class="text-danger">${result.message}</p>`;
        }

        if (autoOpenId && result.success) {
          const targetGame = result.games.find(g => g.contractId === autoOpenId);

          if (targetGame) {
            document.getElementById('loading').classList.add('hidden'); 

            if (targetGame.status === "RUNNING") {
              console.log("狀態 RUNNING -> 進入遊戲");
              enterGame(targetGame.contractId, targetGame.contractName);
            } else {
              if (targetGame.role === "Admin") {
                console.log("狀態 PENDING (隊長) -> 初始設定");
                openSetup(targetGame.contractId, targetGame.contractName);
              } else {
                alert("⏳ 隊長尚未完成「初始設定」，請稍後再來！");
                document.getElementById('gameListArea').classList.remove('hidden');
              }
            }
          } else {
            alert("❌ 找不到該契約資料，請確認您是否已加入。");
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('gameListArea').classList.remove('hidden');
          }
        } else {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('gameListArea').classList.remove('hidden');
        }

      } catch (e) {
        alert("連線錯誤: " + e);
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // 渲染列表
    function renderList(games) {
      const container = document.getElementById('contractsContainer');
      container.innerHTML = "";

      if (games.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">您目前沒有 Game_A 的契約。</p>';
        return;
      }

      games.forEach(game => {
        let actionHtml = "";
        if (game.status === "RUNNING") {
          actionHtml = `<button class="btn btn-game" onclick="enterGame('${game.contractId}', '${game.contractName}')">🎮 進入遊戲</button>`;
        } else if (game.status === "PENDING") {
          if (game.role === "Admin") {
            actionHtml = `<button class="btn btn-main" onclick="openSetup('${game.contractId}', '${game.contractName}')">⚙️ 初始設定</button>`;
          } else {
            actionHtml = `<button class="btn btn-secondary" disabled>⏳ 等待隊長設定...</button>`;
          }
        }

        const card = `
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="m-0">${game.contractName}</h5>
              <span class="status-badge">${game.status}</span>
            </div>
            ${actionHtml}
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // 設定功能
    function openSetup(contractId, name) {
      currentSetupContractId = contractId;
      document.getElementById('setupContractName').innerText = name;
      document.getElementById('gameListArea').classList.add('hidden');
      document.getElementById('setupFormArea').classList.remove('hidden');
    }

    function cancelSetup() {
      document.getElementById('gameListArea').classList.remove('hidden');
      document.getElementById('setupFormArea').classList.add('hidden');
    }

    async function submitSetup() {
      const teamName = document.getElementById('inputTeamName').value;
      const enemy = document.getElementById('inputEnemy').value;
      const treasure = document.getElementById('inputTreasure').value;
      const theme = document.getElementById('inputTheme').value;

      if (!teamName || !enemy || !treasure) { alert("請填寫完整！"); return; }

      const btn = document.querySelector('#setupFormArea .btn-main');
      btn.innerText = "處理中...";
      btn.disabled = true;

      try {
        const payload = {
          action: "create_team",
          userId: userProfile.userId,
          contractId: currentSetupContractId,
          teamName: teamName,
          enemyName: enemy,
          treasureName: treasure,
          storyTheme: theme 
        };

        const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await response.json();

        if (result.success) {
          alert("🎉 " + result.message);
          location.reload(); 
        } else {
          alert("❌ " + result.message);
          btn.disabled = false;
          btn.innerText = "✨ 啟動遊戲";
        }
      } catch (e) {
        alert("錯誤: " + e);
        btn.disabled = false;
        btn.innerText = "✨ 啟動遊戲";
      }
    }

    // ==========================================
    // 🆕 戰鬥功能區 (已修正：移除怪獸操作)
    // ==========================================
    async function enterGame(contractId, contractName) {
      document.getElementById('gameListArea').classList.add('hidden');
      document.getElementById('battleArea').classList.remove('hidden');

      window.currentContractId = contractId;

      // 初始化介面 (只重置文字，不操作不存在的元素)
      document.getElementById('ticketContainer').classList.add('hidden');
      document.getElementById('storyText').innerText = "正在讀取冒險紀錄...";
      document.getElementById('questionText').innerText = "...";

      // 呼叫後端
      fetchGameState(contractId);
    }

    async function fetchGameState(contractId) {
      console.log("正在讀取契約數據 ID:", contractId); 

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "get_game_state",
            contractId: contractId,
            userId: userProfile.userId
          })
        });
        const result = await response.json();
        console.log("回傳資料:", result); 

        if (result.success) {
          // 1. 更新故事與題目
          const storyEl = document.getElementById('storyText');
          const questionEl = document.getElementById('questionText');

          if (storyEl) storyEl.innerText = result.yesterdaySummary;
          if (questionEl) questionEl.innerText = result.mbti.question;

          // 記錄題目類型
          window.currentQuestionType = result.mbti.type;

          // 2. 更新票券顯示
          const ticketEl = document.getElementById('displayTickets');
          const ticketContainer = document.getElementById('ticketContainer');

          if (ticketEl) ticketEl.innerText = result.userTickets;
          if (ticketContainer) ticketContainer.classList.remove('hidden');

          // 3. 處理選項按鈕
          const optionsDiv = document.getElementById('mbtiOptionsArea');
          const statusText = document.getElementById('mbtiStatus');

          if (optionsDiv && statusText) {
            if (result.hasPlayed) {
              // 玩過了 -> 顯示結果
              optionsDiv.classList.add('hidden');
              statusText.innerText = "✅ 您今日已選擇：\n" + result.myChoice;
              statusText.classList.remove('hidden');
            } else {
              // 沒玩過 -> 顯示選項
              optionsDiv.classList.remove('hidden');
              statusText.classList.add('hidden');

              optionsDiv.innerHTML = "";
              result.mbti.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "btn btn-outline-info text-start btn-sm py-2";

                if (result.userTickets < 1) {
                  btn.disabled = true;
                  btn.innerText = `🔒 ${["A. ", "B. ", "C. ", "D. "][index] + optText} (票券不足)`;
                  btn.classList.add('text-muted'); 
                } else {
                  btn.innerText = ["A. ", "B. ", "C. ", "D. "][index] + optText;
                  btn.onclick = () => submitChoice(optText, index, btn);
                }
                optionsDiv.appendChild(btn);
              });
            }
          }

        } else {
          alert("讀取失敗：" + result.message);
          document.getElementById('storyText').innerText = "讀取失敗：" + result.message;
        }
      } catch (e) {
        console.error("狀態讀取發生錯誤", e);
        alert("程式發生錯誤，請檢查 Console: " + e);
      }
    }

    async function submitChoice(choiceText, index, btnElement) {
      const allBtns = document.querySelectorAll('#mbtiOptionsArea button');
      allBtns.forEach(b => b.disabled = true);

      const originalText = btnElement.innerText;
      btnElement.innerText = "⏳ 記錄中...";
      btnElement.className = "btn btn-info text-white text-start btn-sm";

      try {
        const payload = {
          action: "submit_mbti",
          userId: userProfile.userId,
          contractId: window.currentContractId,
          choice: choiceText,
          choiceIndex: index,
          questionType: window.currentQuestionType
        };

        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('mbtiOptionsArea').classList.add('hidden');
          const status = document.getElementById('mbtiStatus');
          status.innerText = "✅ 您的選擇已記錄！(消耗 1 票券)\n選擇：" + choiceText;
          status.classList.remove('hidden');

          if (result.remainingTickets !== undefined) {
            document.getElementById('displayTickets').innerText = result.remainingTickets;
          }

        } else {
          alert("記錄失敗: " + result.message);
          btnElement.innerText = originalText; 
          allBtns.forEach(b => b.disabled = false); 
        }
      } catch (e) {
        alert("連線錯誤");
        btnElement.innerText = originalText;
        allBtns.forEach(b => b.disabled = false);
      }
    }

    main();
  </script>
</body>

</html>
